<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 T-LO 俄羅斯輪盤</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── 星空背景（三層疊加） ── */
        body {
            font-family: 'Noto Sans TC', 'Segoe UI', sans-serif;
            background: #050510;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .stars-layer-1 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(2.5px 2.5px at 8% 12%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 23% 45%, #ffe8c0 45%, transparent 100%),
                radial-gradient(2px 2px at 38% 78%, #fff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 53% 28%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 68% 62%, #c8e0ff 45%, transparent 100%),
                radial-gradient(2px 2px at 78% 8%, #fff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 88% 52%, #ffe0c8 45%, transparent 100%),
                radial-gradient(2px 2px at 13% 88%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 33% 18%, #fff 45%, transparent 100%),
                radial-gradient(2px 2px at 63% 92%, #c8f0ff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 93% 33%, #fff 45%, transparent 100%),
                radial-gradient(2px 2px at 48% 58%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 3% 65%, #ffe8c0 45%, transparent 100%),
                radial-gradient(2px 2px at 73% 42%, #fff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 28% 3%, #c8e0ff 45%, transparent 100%);
            background-size: 350px 350px;
            animation: starDrift 80s linear infinite;
        }
        .stars-layer-2 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(1px 1px at 5% 22%, rgba(255,255,255,0.7) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 18% 55%, rgba(255,255,255,0.6) 40%, transparent 100%),
                radial-gradient(1px 1px at 32% 8%, rgba(255,255,255,0.8) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 47% 72%, rgba(255,255,255,0.5) 40%, transparent 100%),
                radial-gradient(1px 1px at 62% 35%, rgba(255,255,255,0.7) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 77% 18%, rgba(255,255,255,0.6) 40%, transparent 100%),
                radial-gradient(1px 1px at 92% 68%, rgba(255,255,255,0.8) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 42% 48%, rgba(255,255,255,0.5) 40%, transparent 100%),
                radial-gradient(1px 1px at 57% 85%, rgba(255,255,255,0.6) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 72% 92%, rgba(255,255,255,0.7) 40%, transparent 100%);
            background-size: 500px 500px;
            animation: starDrift2 120s linear infinite reverse;
        }
        .stars-layer-3 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(2px 2px at 15% 35%, rgba(200,220,255,0.9) 40%, transparent 100%),
                radial-gradient(3px 3px at 45% 15%, rgba(255,240,200,0.9) 40%, transparent 100%),
                radial-gradient(2px 2px at 75% 65%, rgba(200,255,230,0.8) 40%, transparent 100%);
            background-size: 280px 280px;
            animation: starTwinkle 4s ease-in-out infinite alternate;
        }
        @keyframes starDrift {
            from { background-position: 0 0; }
            to { background-position: 350px 350px; }
        }
        @keyframes starDrift2 {
            from { background-position: 0 0; }
            to { background-position: 500px 500px; }
        }
        @keyframes starTwinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ── 頁首 ── */
        h1 {
            text-align: center;
            padding: 28px 20px 18px;
            font-family: 'Orbitron', monospace;
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ffd700, 0 0 25px #ff8c00, 0 0 50px #ff6b00, 0 0 80px #ff4500;
            position: relative; z-index: 1;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; position: relative; z-index: 1; }

        /* ── 餘額面板 ── */
        .balance {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 18px;
            padding: 14px 20px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(255, 215, 0, 0.03);
        }
        .balance span {
            color: #ffd700;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.6rem;
            text-shadow: 0 0 8px #ffd700, 0 0 20px rgba(255, 215, 0, 0.5);
            transition: transform 0.2s;
            display: inline-block;
        }
        .balance span.pop {
            animation: coinPop 0.4s ease-out;
        }
        @keyframes coinPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35) rotate(-5deg); color: #fff; text-shadow: 0 0 20px #ffd700; }
            100% { transform: scale(1); }
        }

        /* ── 贏錢閃光 ── */
        .win-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.45) 0%, transparent 65%);
            pointer-events: none; z-index: 9998;
            opacity: 0;
        }
        .win-flash.active { opacity: 1; animation: flashBurst 0.7s ease-out forwards; }
        @keyframes flashBurst {
            0% { opacity: 1; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.3); }
        }

        /* ── 轉盤加強版 ── */
        .wheel-container { text-align: center; margin: 20px 0; }
        .wheel-outer-glow {
            position: relative;
            display: inline-block;
            padding: 20px;
        }
        .wheel-outer-glow::before {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255,215,0,0.15) 0deg, transparent 30deg,
                rgba(255,100,0,0.1) 60deg, transparent 90deg,
                rgba(255,215,0,0.12) 120deg, transparent 150deg,
                rgba(255,215,0,0.15) 180deg, transparent 210deg,
                rgba(255,100,0,0.1) 240deg, transparent 270deg,
                rgba(255,215,0,0.12) 300deg, transparent 330deg,
                rgba(255,215,0,0.15) 360deg
            );
            filter: blur(12px);
            animation: outerGlowRotate 10s linear infinite;
        }
        @keyframes outerGlowRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .wheel {
            width: 240px; height: 240px;
            border-radius: 50%;
            margin: 0 auto;
            border: 7px solid #ffd700;
            box-shadow:
                0 0 20px #ffd700,
                0 0 40px rgba(255, 215, 0, 0.7),
                0 0 70px rgba(255, 140, 0, 0.5),
                0 0 100px rgba(255, 100, 0, 0.3),
                inset 0 0 25px rgba(255, 215, 0, 0.25),
                inset 0 0 50px rgba(255, 200, 0, 0.1);
            background: conic-gradient(
                #00aa00 0deg 9.7deg,
                #cc0000 9.7deg 19.4deg,
                #111 19.4deg 29.1deg,
                #cc0000 29.1deg 38.8deg,
                #111 38.8deg 48.5deg,
                #cc0000 48.5deg 58.2deg,
                #111 58.2deg 67.9deg,
                #cc0000 67.9deg 77.6deg,
                #111 77.6deg 87.3deg,
                #cc0000 87.3deg 97deg,
                #111 97deg 106.7deg,
                #cc0000 106.7deg 116.4deg,
                #111 116.4deg 126.1deg,
                #cc0000 126.1deg 135.8deg,
                #111 135.8deg 145.5deg,
                #cc0000 145.5deg 155.2deg,
                #111 155.2deg 164.9deg,
                #cc0000 164.9deg 174.6deg,
                #111 174.6deg 184.3deg,
                #cc0000 184.3deg 194deg,
                #111 194deg 203.7deg,
                #cc0000 203.7deg 213.4deg,
                #111 213.4deg 223.1deg,
                #cc0000 223.1deg 232.8deg,
                #111 232.8deg 242.5deg,
                #cc0000 242.5deg 252.2deg,
                #111 252.2deg 261.9deg,
                #cc0000 261.9deg 271.6deg,
                #111 271.6deg 281.3deg,
                #cc0000 281.3deg 291deg,
                #111 291deg 300.7deg,
                #cc0000 300.7deg 310.4deg,
                #111 310.4deg 320.1deg,
                #cc0000 320.1deg 329.8deg,
                #111 329.8deg 339.5deg,
                #cc0000 339.5deg 349.2deg,
                #111 349.2deg 360deg
            );
            transition: box-shadow 0.3s;
            position: relative; z-index: 1;
        }
        .wheel.spinning {
            animation: wheelGlow 0.8s infinite alternate;
        }
        @keyframes wheelGlow {
            from { box-shadow: 0 0 20px #ffd700, 0 0 40px rgba(255,215,0,0.7), 0 0 70px rgba(255,140,0,0.5), 0 0 100px rgba(255,100,0,0.3), inset 0 0 25px rgba(255,215,0,0.25); }
            to { box-shadow: 0 0 35px #ffd700, 0 0 70px rgba(255,215,0,0.9), 0 0 110px rgba(255,140,0,0.7), 0 0 150px rgba(255,100,0,0.4), inset 0 0 35px rgba(255,215,0,0.35); }
        }
        .wheel-pointer {
            font-size: 1.8rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 10px #ffd700);
            line-height: 1;
            position: relative; z-index: 2;
        }

        /* ── 結果顯示 ── */
        .result-display {
            text-align: center;
            font-size: 1.4rem;
            padding: 16px;
            margin: 16px 0;
            border-radius: 14px;
            font-weight: 700;
            min-height: 60px;
            display: flex; align-items: center; justify-content: center;
        }
        .result-display.red {
            background: linear-gradient(135deg, rgba(204,0,0,0.5), rgba(255,50,50,0.3));
            border: 1px solid rgba(255,50,50,0.6);
            color: #ff6b6b;
            box-shadow: 0 0 25px rgba(204,0,0,0.5);
        }
        .result-display.black {
            background: linear-gradient(135deg, rgba(40,40,40,0.8), rgba(80,80,80,0.4));
            border: 1px solid rgba(150,150,150,0.5);
            color: #cccccc;
        }
        .result-display.green {
            background: linear-gradient(135deg, rgba(0,150,0,0.5), rgba(50,255,50,0.3));
            border: 1px solid rgba(50,255,50,0.5);
            color: #00ff88;
            box-shadow: 0 0 25px rgba(0,200,0,0.5);
        }
        .result-display.spinning {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.15));
            border: 1px solid rgba(255,215,0,0.4);
            animation: pulse 0.5s infinite alternate;
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        @keyframes pulse { from { opacity: 1; } to { opacity: 0.55; } }

        .timer {
            text-align: center;
            font-size: 1.3rem;
            font-family: 'Orbitron', monospace;
            color: #ffd700;
            margin-bottom: 18px;
            text-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255,215,0,0.4);
            letter-spacing: 2px;
        }

        /* ── 下注按鈕 ── */
        .bet-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
        .bet-btn {
            padding: 14px 8px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .bet-btn::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0; transition: opacity 0.25s;
        }
        .bet-btn:hover::before { opacity: 1; }
        .bet-btn.red {
            background: linear-gradient(135deg, #cc0000, #ff4444);
            color: white;
            border-color: rgba(255,80,80,0.5);
            box-shadow: 0 4px 15px rgba(204,0,0,0.35), 0 0 20px rgba(255,0,0,0.15);
        }
        .bet-btn.red:hover {
            box-shadow: 0 0 25px rgba(255,50,50,0.8), 0 0 50px rgba(255,0,0,0.4), 0 4px 15px rgba(204,0,0,0.5);
            transform: translateY(-3px) scale(1.03);
            border-color: #ff8888;
        }
        .bet-btn.black {
            background: linear-gradient(135deg, #2a2a2a, #555555);
            color: white;
            border-color: rgba(150,150,150,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 15px rgba(150,150,150,0.1);
        }
        .bet-btn.black:hover {
            box-shadow: 0 0 25px rgba(150,150,150,0.5), 0 0 50px rgba(200,200,200,0.2), 0 4px 15px rgba(0,0,0,0.5);
            transform: translateY(-3px) scale(1.03);
            border-color: #aaa;
        }
        .bet-btn.odd {
            background: linear-gradient(135deg, #0055cc, #00aaff);
            color: white;
            border-color: rgba(80,180,255,0.5);
            box-shadow: 0 4px 15px rgba(0,100,200,0.35), 0 0 20px rgba(0,150,255,0.15);
        }
        .bet-btn.odd:hover {
            box-shadow: 0 0 25px rgba(0,150,255,0.7), 0 0 50px rgba(0,100,200,0.35), 0 4px 15px rgba(0,100,200,0.4);
            transform: translateY(-3px) scale(1.03);
            border-color: #88ddff;
        }
        .bet-btn.even {
            background: linear-gradient(135deg, #5500aa, #aa00cc);
            color: white;
            border-color: rgba(180,80,220,0.5);
            box-shadow: 0 4px 15px rgba(100,0,180,0.35), 0 0 20px rgba(160,0,220,0.15);
        }
        .bet-btn.even:hover {
            box-shadow: 0 0 25px rgba(160,0,220,0.7), 0 0 50px rgba(120,0,200,0.35), 0 4px 15px rgba(100,0,180,0.4);
            transform: translateY(-3px) scale(1.03);
            border-color: #cc88ff;
        }

        /* ── 數字下注 ── */
        .number-bet { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
        .number-bet input {
            flex: 1; padding: 12px 10px;
            border: 2px solid rgba(255,215,0,0.25);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .number-bet input:focus {
            border-color: rgba(255,215,0,0.6);
            box-shadow: 0 0 15px rgba(255,215,0,0.15);
        }
        .number-bet input::placeholder { color: rgba(255,255,255,0.3); }
        .number-bet button {
            padding: 12px 14px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            color: #1a1a2e;
            box-shadow: 0 0 20px rgba(255,215,0,0.35), 0 4px 10px rgba(255,140,0,0.2);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .number-bet button:hover {
            box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 50px rgba(255,140,0,0.3);
            transform: translateY(-2px);
        }

        /* ── 我的下注 ── */
        .my-bets {
            background: rgba(0,0,0,0.4);
            padding: 14px;
            border-radius: 14px;
            margin-top: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
        }
        .my-bets h4 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: 0.95rem;
            text-shadow: 0 0 8px rgba(255,215,0,0.4);
            letter-spacing: 1px;
        }
        .bet-item {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            display: flex; justify-content: space-between;
        }
        .bet-item:last-child { border-bottom: none; }

        /* ── 登入區 ── */
        .auth-section {
            background: rgba(10,10,30,0.7);
            padding: 24px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
        }
        .auth-section input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 10px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-section input:focus {
            border-color: rgba(255,215,0,0.5);
            box-shadow: 0 0 15px rgba(255,215,0,0.12);
        }
        .auth-section input::placeholder { color: rgba(255,255,255,0.3); }
        .auth-section label {
            display: block;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        .auth-section button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            color: #1a1a2e;
            font-family: 'Noto Sans TC', sans-serif;
            box-shadow: 0 0 25px rgba(255,215,0,0.3), 0 4px 15px rgba(255,140,0,0.2);
            transition: all 0.25s;
            letter-spacing: 2px;
        }
        .auth-section button:hover {
            box-shadow: 0 0 40px rgba(255,215,0,0.55), 0 0 70px rgba(255,140,0,0.3), 0 4px 20px rgba(255,140,0,0.3);
            transform: translateY(-2px);
        }
        .auth-section .required { color: #ff6b6b; }

        /* ── 儲值按鈕 ── */
        .topup-section { margin-top: 14px; }
        .topup-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00c853, #00e676);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            display: block;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(0,200,83,0.35), 0 4px 15px rgba(0,200,83,0.2);
            transition: all 0.25s;
            letter-spacing: 1px;
        }
        .topup-btn:hover {
            box-shadow: 0 0 40px rgba(0,230,118,0.65), 0 0 70px rgba(0,200,83,0.3);
            transform: translateY(-2px);
        }

        /* ── 儲值 Modal ── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            display: none; justify-content: center; align-items: center;
            z-index: 9999;
            backdrop-filter: blur(6px);
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 3px solid #00c853;
            border-radius: 20px;
            padding: 32px 28px;
            max-width: 340px; width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,200,83,0.3), 0 20px 60px rgba(0,0,0,0.6);
            position: relative;
        }
        .modal-box h3 { color: #00ff88; font-size: 1.3rem; margin-bottom: 18px; font-family: 'Orbitron', monospace; letter-spacing: 1px; text-shadow: 0 0 15px rgba(0,255,136,0.5); }
        .modal-box p { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
        .line-id-box {
            background: #0a0f1a;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 16px;
            margin: 14px 0;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }
        .line-id-value { color: #00ff88; font-size: 1.25rem; font-weight: 700; font-family: 'Orbitron', monospace; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,136,0.4); }
        .copy-btn {
            background: #00c853; color: white;
            border: none; padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem; font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(0,200,83,0.3);
        }
        .copy-btn:hover { background: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.6); }
        .copy-btn.copied { background: #555; }
        .line-link-btn {
            display: block; width: 100%; padding: 14px;
            background: #00c853; color: white;
            border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700;
            text-decoration: none; margin-top: 12px;
            text-align: center;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(0,200,83,0.3);
        }
        .line-link-btn:hover { background: #00e676; box-shadow: 0 0 30px rgba(0,230,118,0.6); }
        .modal-close {
            position: absolute; top: 14px; right: 18px;
            font-size: 1.5rem; color: rgba(255,255,255,0.4);
            cursor: pointer; background: none; border: none;
            transition: color 0.2s;
        }
        .modal-close:hover { color: white; }
        .modal-hint { font-size: 0.78rem; color: rgba(255,255,255,0.35); margin-top: 14px; line-height: 1.5; }

        /* ── 游標 ── */
        button { cursor: pointer; }
    </style>
</head>
<body>
    <!-- 三層星空背景 -->
    <div class="stars">
        <div class="stars-layer-1"></div>
        <div class="stars-layer-2"></div>
        <div class="stars-layer-3"></div>
    </div>
    <!-- 贏錢閃光 -->
    <div class="win-flash" id="winFlash"></div>

    <h1>🎰 T-LO 俄羅斯輪盤</h1>

    <div class="container">
        <div class="balance">💰 餘額 <span id="balance">1000</span></div>

        <div class="auth-section" id="authSection">
            <input type="text" id="username" placeholder="帳號名稱" value="Player1">
            <label>姓名 <span class="required">*</span></label>
            <input type="text" id="realname" placeholder="真實姓名">
            <label>電話 <span class="required">*</span></label>
            <input type="tel" id="phone" placeholder="聯絡電話">
            <label>信箱</label>
            <input type="email" id="email" placeholder="電子郵件（選填）">
            <button onclick="doLogin()">▶ 開始遊戲</button>
        </div>

        <div class="game-section" id="gameSection" style="display:none;">
            <div class="wheel-container">
                <div class="wheel-pointer">▼</div>
                <div class="wheel-outer-glow">
                    <div class="wheel" id="wheel"></div>
                </div>
            </div>

            <div class="result-display" id="resultDisplay">等待開始...</div>
            <div class="timer" id="timer">—</div>

            <div class="bet-buttons">
                <button class="bet-btn red" onclick="placeBet('color', 50, 'red')">🔴 紅 (2x)</button>
                <button class="bet-btn black" onclick="placeBet('color', 50, 'black')">⚫ 黑 (2x)</button>
                <button class="bet-btn odd" onclick="placeBet('odd_even', 50, 'odd')">🔢 單 (2x)</button>
                <button class="bet-btn even" onclick="placeBet('odd_even', 50, 'even')">⚇ 雙 (2x)</button>
            </div>

            <div class="number-bet">
                <input type="number" id="betNum" placeholder="數字 0-36" min="0" max="36">
                <input type="number" id="betAmt" placeholder="金額" min="10" value="50">
                <button onclick="placeNumberBet()">數 (10x)</button>
            </div>

            <div class="my-bets">
                <h4>📋 我的下注</h4>
                <div id="myBets">尚無下注</div>
            </div>

            <div class="topup-section">
                <button class="topup-btn" onclick="showTopupModal()">💰 儲值</button>
            </div>
        </div>
    </div>

    <!-- 儲值 Modal -->
    <div class="modal-overlay" id="topupModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeTopupModal()">✕</button>
            <h3>💰 聯絡儲值</h3>
            <p>複製LINE ID，搜尋新增好友</p>
            <div class="line-id-box">
                <span class="line-id-value" id="lineIdText">HAPPYNEWYA</span>
                <button class="copy-btn" id="copyBtn" onclick="copyLineId()">複製</button>
            </div>
            <a href="https://line.me/ti/p/~happynewya" target="_blank" class="line-link-btn">💬 加我LINE</a>
            <p class="modal-hint">匯款後請截圖傳給管理員<br>確認後將金幣發送至您的帳戶</p>
        </div>
    </div>

    <script>
        let ws, myName = '', myBalance = 1000, gamePhase = 'idle', myCurrentBets = [], myProfile = {};

        function connect() {
            ws = new WebSocket('ws://' + location.host);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'join', username: myName, profile: myProfile }));
            ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
            ws.onclose = () => setTimeout(connect, 3000);
        }

        function triggerWinFlash() {
            const f = document.getElementById('winFlash');
            f.classList.remove('active');
            void f.offsetWidth;
            f.classList.add('active');
            setTimeout(() => f.classList.remove('active'), 800);
        }

        function animateBalanceGain(amount) {
            const el = document.getElementById('balance');
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'joined':
                    myBalance = data.balance || 1000;
                    document.getElementById('balance').textContent = myBalance;
                    break;
                case 'betting_start':
                    gamePhase = 'betting';
                    myCurrentBets = [];
                    document.getElementById('resultDisplay').textContent = '⏰ 下注時間!';
                    document.getElementById('resultDisplay').className = 'result-display spinning';
                    document.getElementById('wheel').classList.remove('spinning');
                    updateTimer(data.duration);
                    updateMyBets();
                    break;
                case 'spinning':
                    gamePhase = 'spinning';
                    document.getElementById('resultDisplay').textContent = '🎰 轉動中...';
                    document.getElementById('resultDisplay').className = 'result-display spinning';
                    document.getElementById('wheel').classList.add('spinning');
                    break;
                case 'result':
                    gamePhase = 'result';
                    document.getElementById('wheel').classList.remove('spinning');
                    const colors = { red: '🔴 紅色', black: '⚫ 黑色', green: '🟢 綠色' };
                    document.getElementById('resultDisplay').textContent = '結果: ' + data.result + ' ' + colors[data.color];
                    document.getElementById('resultDisplay').className = 'result-display ' + data.color;
                    const myWin = data.winners.find(w => w.username === myName);
                    const myLoss = data.losers.find(l => l.username === myName);
                    if (myWin) {
                        myBalance += myWin.prize;
                        triggerWinFlash();
                        animateBalanceGain(myWin.prize);
                        alert('🎉 贏了 ' + myWin.prize + ' 金幣！');
                    }
                    if (myLoss) { myBalance -= myLoss.amount; }
                    document.getElementById('balance').textContent = myBalance;
                    break;
            }
        }

        let timerInterval;
        function updateTimer(duration) {
            clearInterval(timerInterval);
            let sec = Math.floor(duration / 1000);
            document.getElementById('timer').textContent = '⏰ ' + sec + 's';
            timerInterval = setInterval(() => {
                sec--;
                document.getElementById('timer').textContent = sec > 0 ? '⏰ ' + sec + 's' : '—';
                if (sec <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function placeBet(type, amount, choice) {
            if (gamePhase !== 'betting') { alert('現在不能下注！'); return; }
            ws.send(JSON.stringify({ type: 'bet', username: myName, betType: type, amount, color: choice, choice }));
            myCurrentBets.push({ type, amount, info: choice });
            updateMyBets();
        }

        function placeNumberBet() {
            const num = parseInt(document.getElementById('betNum').value);
            const amt = parseInt(document.getElementById('betAmt').value);
            if (isNaN(num) || num < 0 || num > 36) { alert('請選0-36數字'); return; }
            if (isNaN(amt) || amt < 10) { alert('金額至少10'); return; }
            if (gamePhase !== 'betting') { alert('現在不能下注！'); return; }
            ws.send(JSON.stringify({ type: 'bet', username: myName, betType: 'number', amount: amt, number: num }));
            myCurrentBets.push({ type: 'number', amount: amt, info: '#' + num });
            updateMyBets();
        }

        function updateMyBets() {
            document.getElementById('myBets').innerHTML = myCurrentBets.length
                ? myCurrentBets.map(b => '<div class="bet-item"><span>' + b.info + '</span><span>' + b.amount + '</span></div>').join('')
                : '尚無下注';
        }

        function doLogin() {
            myName = document.getElementById('username').value || 'Player' + Math.floor(Math.random() * 1000);
            const realname = document.getElementById('realname').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            myProfile = { realname, phone, email };
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('gameSection').style.display = 'block';
            connect();
        }

        function showTopupModal() { document.getElementById('topupModal').classList.add('show'); }
        function closeTopupModal() { document.getElementById('topupModal').classList.remove('show'); }

        function copyLineId() {
            const text = document.getElementById('lineIdText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '已複製!';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
            });
        }

        document.getElementById('topupModal').addEventListener('click', function(e) {
            if (e.target === this) closeTopupModal();
        });
    </script>
</body>
</html>
