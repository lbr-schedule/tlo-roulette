<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 T-LO 俄羅斯輪盤</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── 三層星空背景 ── */
        body {
            font-family: 'Noto Sans TC', 'Segoe UI', sans-serif;
            background: #050510;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .stars-layer-1 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(2.5px 2.5px at 8% 12%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 23% 45%, #ffe8c0 45%, transparent 100%),
                radial-gradient(2px 2px at 38% 78%, #fff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 53% 28%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 68% 62%, #c8e0ff 45%, transparent 100%),
                radial-gradient(2px 2px at 78% 8%, #fff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 88% 52%, #ffe0c8 45%, transparent 100%),
                radial-gradient(2px 2px at 13% 88%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 33% 18%, #fff 45%, transparent 100%),
                radial-gradient(2px 2px at 63% 92%, #c8f0ff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 93% 33%, #fff 45%, transparent 100%),
                radial-gradient(2px 2px at 48% 58%, #fff 45%, transparent 100%),
                radial-gradient(3px 3px at 3% 65%, #ffe8c0 45%, transparent 100%),
                radial-gradient(2px 2px at 73% 42%, #fff 45%, transparent 100%),
                radial-gradient(2.5px 2.5px at 28% 3%, #c8e0ff 45%, transparent 100%);
            background-size: 350px 350px;
            animation: starDrift 80s linear infinite;
        }
        .stars-layer-2 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(1px 1px at 5% 22%, rgba(255,255,255,0.7) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 18% 55%, rgba(255,255,255,0.6) 40%, transparent 100%),
                radial-gradient(1px 1px at 32% 8%, rgba(255,255,255,0.8) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 47% 72%, rgba(255,255,255,0.5) 40%, transparent 100%),
                radial-gradient(1px 1px at 62% 35%, rgba(255,255,255,0.7) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 77% 18%, rgba(255,255,255,0.6) 40%, transparent 100%),
                radial-gradient(1px 1px at 92% 68%, rgba(255,255,255,0.8) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 42% 48%, rgba(255,255,255,0.5) 40%, transparent 100%),
                radial-gradient(1px 1px at 57% 85%, rgba(255,255,255,0.6) 40%, transparent 100%),
                radial-gradient(1.5px 1.5px at 72% 92%, rgba(255,255,255,0.7) 40%, transparent 100%);
            background-size: 500px 500px;
            animation: starDrift2 120s linear infinite reverse;
        }
        .stars-layer-3 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(2px 2px at 15% 35%, rgba(200,220,255,0.9) 40%, transparent 100%),
                radial-gradient(3px 3px at 45% 15%, rgba(255,240,200,0.9) 40%, transparent 100%),
                radial-gradient(2px 2px at 75% 65%, rgba(200,255,230,0.8) 40%, transparent 100%);
            background-size: 280px 280px;
            animation: starTwinkle 4s ease-in-out infinite alternate;
        }
        @keyframes starDrift {
            from { background-position: 0 0; }
            to { background-position: 350px 350px; }
        }
        @keyframes starDrift2 {
            from { background-position: 0 0; }
            to { background-position: 500px 500px; }
        }
        @keyframes starTwinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ── 頁首 ── */
        h1 {
            text-align: center;
            padding: 22px 20px 14px;
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ffd700, 0 0 25px #ff8c00, 0 0 50px #ff6b00, 0 0 80px #ff4500;
            position: relative; z-index: 1;
        }
        /* 音效開關 */
        .sound-toggle {
            position: fixed; top: 14px; right: 16px; z-index: 100;
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.4);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            color: #ffd700;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }
        .sound-toggle:hover { box-shadow: 0 0 20px rgba(255,215,0,0.5); border-color: #ffd700; }
        .sound-toggle.muted { color: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.2); box-shadow: none; }

        .container { max-width: 520px; margin: 0 auto; padding: 0 12px 40px; position: relative; z-index: 1; }

        /* ── 餘額面板 ── */
        .balance {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 12px;
            padding: 12px 18px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .balance .label { font-size: 1rem; opacity: 0.8; }
        .balance span {
            color: #ffd700;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.5rem;
            text-shadow: 0 0 8px #ffd700, 0 0 20px rgba(255, 215, 0, 0.5);
            transition: transform 0.2s;
            display: inline-block;
            min-width: 60px;
        }
        .balance span.pop { animation: coinPop 0.4s ease-out; }
        @keyframes coinPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.4) rotate(-5deg); color: #fff; text-shadow: 0 0 25px #ffd700; }
            100% { transform: scale(1); }
        }

        /* ── 倒數進度條 ── */
        .progress-bar-wrap {
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ff4500);
            width: 0%;
            transition: width 1s linear;
            box-shadow: 0 0 8px rgba(255,200,0,0.5);
        }

        /* ── 歷史路紙 ── */
        .history-section {
            display: flex; gap: 6px; align-items: center;
            margin-bottom: 14px; flex-wrap: wrap;
            padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .history-label {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.4);
            margin-right: 4px;
            white-space: nowrap;
        }
        .history-dot {
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
            animation: dotPop 0.3s ease-out;
        }
        @keyframes dotPop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .history-dot.red { background: linear-gradient(135deg, #cc0000, #ff4444); color: white; }
        .history-dot.black { background: linear-gradient(135deg, #333, #666); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .history-dot.green { background: linear-gradient(135deg, #009900, #00cc00); color: white; }

        /* ── 贏錢閃光 ── */
        .win-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.45) 0%, transparent 65%);
            pointer-events: none; z-index: 9998;
            opacity: 0;
        }
        .win-flash.active { opacity: 1; animation: flashBurst 0.7s ease-out forwards; }
        @keyframes flashBurst {
            0% { opacity: 1; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.1); }
            100% { opacity: 0; transform: scale(1.3); }
        }

        /* ── 金幣噴射 ── */
        .coin-particle {
            position: fixed;
            font-size: 1.4rem;
            pointer-events: none;
            z-index: 9997;
            animation: coinFly 1s ease-out forwards;
            filter: drop-shadow(0 0 6px #ffd700);
        }
        @keyframes coinFly {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
        }

        /* ── 畫面震動 ── */
        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px) rotate(-0.5deg); }
            30% { transform: translateX(8px) rotate(0.5deg); }
            45% { transform: translateX(-6px) rotate(-0.3deg); }
            60% { transform: translateX(6px) rotate(0.3deg); }
            75% { transform: translateX(-3px); }
            90% { transform: translateX(3px); }
        }
        body.shaking { animation: screenShake 0.6s ease-out; }

        /* ── 轉盤區 ── */
        .wheel-container { text-align: center; margin: 10px 0; }
        .wheel-outer-glow {
            position: relative;
            display: inline-block;
            padding: 18px;
        }
        .wheel-outer-glow::before {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255,215,0,0.15) 0deg, transparent 30deg,
                rgba(255,100,0,0.1) 60deg, transparent 90deg,
                rgba(255,215,0,0.12) 120deg, transparent 150deg,
                rgba(255,215,0,0.15) 180deg, transparent 210deg,
                rgba(255,100,0,0.1) 240deg, transparent 270deg,
                rgba(255,215,0,0.12) 300deg, transparent 330deg,
                rgba(255,215,0,0.15) 360deg
            );
            filter: blur(12px);
            animation: outerGlowRotate 10s linear infinite;
        }
        @keyframes outerGlowRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .wheel {
            width: 230px; height: 230px;
            border-radius: 50%;
            margin: 0 auto;
            border: 7px solid #ffd700;
            box-shadow:
                0 0 20px #ffd700,
                0 0 40px rgba(255, 215, 0, 0.7),
                0 0 70px rgba(255, 140, 0, 0.5),
                0 0 100px rgba(255, 100, 0, 0.3),
                inset 0 0 25px rgba(255, 215, 0, 0.25),
                inset 0 0 50px rgba(255, 200, 0, 0.1);
            background: conic-gradient(
                #00aa00 0deg 9.7deg,
                #cc0000 9.7deg 19.4deg,
                #111 19.4deg 29.1deg,
                #cc0000 29.1deg 38.8deg,
                #111 38.8deg 48.5deg,
                #cc0000 48.5deg 58.2deg,
                #111 58.2deg 67.9deg,
                #cc0000 67.9deg 77.6deg,
                #111 77.6deg 87.3deg,
                #cc0000 87.3deg 97deg,
                #111 97deg 106.7deg,
                #cc0000 106.7deg 116.4deg,
                #111 116.4deg 126.1deg,
                #cc0000 126.1deg 135.8deg,
                #111 135.8deg 145.5deg,
                #cc0000 145.5deg 155.2deg,
                #111 155.2deg 164.9deg,
                #cc0000 164.9deg 174.6deg,
                #111 174.6deg 184.3deg,
                #cc0000 184.3deg 194deg,
                #111 194deg 203.7deg,
                #cc0000 203.7deg 213.4deg,
                #111 213.4deg 223.1deg,
                #cc0000 223.1deg 232.8deg,
                #111 232.8deg 242.5deg,
                #cc0000 242.5deg 252.2deg,
                #111 252.2deg 261.9deg,
                #cc0000 261.9deg 271.6deg,
                #111 271.6deg 281.3deg,
                #cc0000 281.3deg 291deg,
                #111 291deg 300.7deg,
                #cc0000 300.7deg 310.4deg,
                #111 310.4deg 320.1deg,
                #cc0000 320.1deg 329.8deg,
                #111 329.8deg 339.5deg,
                #cc0000 339.5deg 349.2deg,
                #111 349.2deg 360deg
            );
            transition: box-shadow 0.3s;
            position: relative; z-index: 1;
        }
        .wheel.spinning { animation: wheelGlow 0.8s infinite alternate; }
        @keyframes wheelGlow {
            from { box-shadow: 0 0 20px #ffd700, 0 0 40px rgba(255,215,0,0.7), 0 0 70px rgba(255,140,0,0.5), 0 0 100px rgba(255,100,0,0.3), inset 0 0 25px rgba(255,215,0,0.25); }
            to { box-shadow: 0 0 35px #ffd700, 0 0 70px rgba(255,215,0,0.9), 0 0 110px rgba(255,140,0,0.7), 0 0 150px rgba(255,100,0,0.4), inset 0 0 35px rgba(255,215,0,0.35); }
        }
        .wheel-pointer {
            font-size: 1.8rem;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 10px #ffd700);
            line-height: 1;
            position: relative; z-index: 2;
        }

        /* ── 結果顯示 ── */
        .result-display {
            text-align: center;
            font-size: 1.4rem;
            padding: 14px;
            margin: 12px 0;
            border-radius: 14px;
            font-weight: 700;
            min-height: 54px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }
        .result-display.red { background: linear-gradient(135deg, rgba(204,0,0,0.5), rgba(255,50,50,0.3)); border: 1px solid rgba(255,50,50,0.6); color: #ff6b6b; box-shadow: 0 0 25px rgba(204,0,0,0.5); }
        .result-display.black { background: linear-gradient(135deg, rgba(40,40,40,0.8), rgba(80,80,80,0.4)); border: 1px solid rgba(150,150,150,0.5); color: #cccccc; }
        .result-display.green { background: linear-gradient(135deg, rgba(0,150,0,0.5), rgba(50,255,50,0.3)); border: 1px solid rgba(50,255,50,0.5); color: #00ff88; box-shadow: 0 0 25px rgba(0,200,0,0.5); }
        .result-display.spinning { background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.15)); border: 1px solid rgba(255,215,0,0.4); animation: pulse 0.5s infinite alternate; color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        @keyframes pulse { from { opacity: 1; } to { opacity: 0.55; } }

        .timer {
            text-align: center;
            font-size: 1.2rem;
            font-family: 'Orbitron', monospace;
            color: #ffd700;
            margin-bottom: 12px;
            text-shadow: 0 0 10px #ffd700;
            letter-spacing: 2px;
        }

        /* ── 投注區（輪盤式） ── */
        .betting-layout { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
        .bet-panel {
            flex: 1;
            background: rgba(0,0,0,0.35);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
        }
        .bet-panel-title {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-align: center;
        }
        /* 顏色/單雙下注 */
        .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .bet-btn {
            padding: 10px 4px;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            position: relative; overflow: hidden;
        }
        .bet-btn::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0; transition: opacity 0.2s;
        }
        .bet-btn:hover::before { opacity: 1; }
        .bet-btn .multiplier { font-size: 0.68rem; opacity: 0.7; font-family: 'Orbitron', monospace; }
        .bet-btn.red { background: linear-gradient(135deg, #cc0000, #ff4444); color: white; border-color: rgba(255,80,80,0.4); box-shadow: 0 3px 10px rgba(204,0,0,0.3); }
        .bet-btn.red:hover { box-shadow: 0 0 20px rgba(255,50,50,0.7), 0 0 40px rgba(255,0,0,0.3); transform: translateY(-2px) scale(1.04); }
        .bet-btn.black { background: linear-gradient(135deg, #2a2a2a, #555); color: white; border-color: rgba(150,150,150,0.35); box-shadow: 0 3px 10px rgba(0,0,0,0.4); }
        .bet-btn.black:hover { box-shadow: 0 0 20px rgba(150,150,150,0.5), 0 0 40px rgba(150,150,150,0.2); transform: translateY(-2px) scale(1.04); }
        .bet-btn.odd { background: linear-gradient(135deg, #0055cc, #00aaff); color: white; border-color: rgba(80,180,255,0.4); box-shadow: 0 3px 10px rgba(0,100,200,0.3); }
        .bet-btn.odd:hover { box-shadow: 0 0 20px rgba(0,150,255,0.6), 0 0 40px rgba(0,100,200,0.3); transform: translateY(-2px) scale(1.04); }
        .bet-btn.even { background: linear-gradient(135deg, #5500aa, #aa00cc); color: white; border-color: rgba(180,80,220,0.4); box-shadow: 0 3px 10px rgba(100,0,180,0.3); }
        .bet-btn.even:hover { box-shadow: 0 0 20px rgba(160,0,220,0.6), 0 0 40px rgba(120,0,200,0.3); transform: translateY(-2px) scale(1.04); }
        /* 數字網格 */
        .number-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
        }
        .num-btn {
            aspect-ratio: 1;
            border-radius: 6px;
            border: none;
            font-size: 0.72rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            transition: all 0.15s;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .num-btn.red-n { background: linear-gradient(135deg, #cc0000, #ff4444); color: white; box-shadow: 0 2px 6px rgba(204,0,0,0.3); }
        .num-btn.black-n { background: linear-gradient(135deg, #222, #555); color: white; border: 1px solid rgba(100,100,100,0.3); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .num-btn.green-n { background: linear-gradient(135deg, #009900, #00cc00); color: white; box-shadow: 0 2px 6px rgba(0,150,0,0.3); }
        .num-btn:hover { transform: scale(1.1); z-index: 2; }
        .num-btn.red-n:hover { box-shadow: 0 0 12px rgba(255,50,50,0.7); }
        .num-btn.black-n:hover { box-shadow: 0 0 12px rgba(150,150,150,0.5); }
        .num-btn.green-n:hover { box-shadow: 0 0 12px rgba(0,200,0,0.6); }
        .num-btn.selected { outline: 3px solid #ffd700; outline-offset: 1px; }

        /* ── 快速下注金額 ── */
        .quick-amounts {
            display: flex; gap: 6px; margin-bottom: 10px;
            justify-content: center;
        }
        .quick-amt-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,215,0,0.06);
            color: #ffd700;
            font-size: 0.78rem;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-amt-btn:hover, .quick-amt-btn.active {
            background: rgba(255,215,0,0.15);
            box-shadow: 0 0 12px rgba(255,215,0,0.3);
            border-color: #ffd700;
        }

        /* ── 下注輸入 + 投注按鈕 ── */
        .bet-input-row {
            display: flex; gap: 8px; margin-bottom: 10px; align-items: center;
        }
        .bet-input-row input {
            flex: 1; padding: 10px 12px;
            border: 2px solid rgba(255,215,0,0.25);
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 0.9rem;
            font-family: 'Orbitron', monospace;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .bet-input-row input:focus { border-color: rgba(255,215,0,0.6); box-shadow: 0 0 12px rgba(255,215,0,0.12); }
        .bet-input-row input::placeholder { color: rgba(255,255,255,0.3); font-family: 'Noto Sans TC', sans-serif; }
        .bet-place-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255,215,0,0.3);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .bet-place-btn:hover { box-shadow: 0 0 28px rgba(255,215,0,0.55); transform: translateY(-1px); }
        .bet-place-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ── 我的下注 ── */
        .my-bets {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 14px;
            margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            max-height: 130px; overflow-y: auto;
        }

<body>

            </div>

    <script>
    // ═══════════════════════════════════════════
    //  音效系統（Web Audio API）
    // ═══════════════════════════════════════════
    let audioCtx = null;
    let soundMuted = false;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSound(type) {
        if (soundMuted) return;
        try {
            initAudio();
            const ctx = audioCtx;
            const now = ctx.currentTime;
            if (type === 'click') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'spin') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.25);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.25);
                });
            } else if (type === 'lose') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'tick') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 1200;
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'bet') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(900, now + 0.05);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            }
        } catch(e) {}
    }
    function toggleSound() {
        soundMuted = !soundMuted;
        const btn = document.getElementById('soundToggle');
        btn.textContent = soundMuted ? '🔇' : '🔊';
        btn.classList.toggle('muted', soundMuted);
        playSound('click');
    }

    // ═══════════════════════════════════════════
    //  輪盤數字與顏色
    // ═══════════════════════════════════════════
    const ROULETTE_COLORS = {
        0: 'green', 1: 'red', 2: 'black', 3: 'red', 4: 'black', 5: 'red', 6: 'black',
        7: 'red', 8: 'black', 9: 'red', 10: 'black', 11: 'black', 12: 'red',
        13: 'black', 14: 'red', 15: 'black', 16: 'red', 17: 'black', 18: 'red',
        19: 'red', 20: 'black', 21: 'red', 22: 'black', 23: 'red', 24: 'black',
        25: 'red', 26: 'black', 27: 'red', 28: 'black', 29: 'black', 30: 'red',
        31: 'black', 32: 'red', 33: 'black', 34: 'red', 35: 'black', 36: 'red'
    };
    const ROULETTE_NUMS = Array.from({length: 37}, (_, i) => i);

    // 構建數字網格（0單獨一行，其他3x12）
    function buildNumberGrid() {
        const grid = document.getElementById('numberGrid');
        grid.innerHTML = '';
        // 0 在頂部單獨
        const zeroBtn = document.createElement('button');
        zeroBtn.className = 'num-btn green-n';
        zeroBtn.textContent = '0';
        zeroBtn.onclick = () => selectNumber(0);
        grid.appendChild(zeroBtn);
        // 其餘數字 1-36 每列3個循環
        for (let n = 1; n <= 36; n++) {
            const btn = document.createElement('button');
            const color = ROULETTE_COLORS[n];
            btn.className = 'num-btn ' + color + '-n';
            btn.textContent = n;
            btn.onclick = () => selectNumber(n);
            grid.appendChild(btn);
        }
    }

    // ═══════════════════════════════════════════
    //  狀態
    // ═══════════════════════════════════════════
    let ws, myName = '', myBalance = 1000, gamePhase = 'idle';
    let myBets = []; // {type, choice, amount, id}
    let selectedBet = null; // {type, choice}
    let quickAmount = 50;
    let history = []; // ['red','black','green'...]
    const MAX_HISTORY = 20;
    let timerInterval = null;
    let progressTimer = null;

    // ═══════════════════════════════════════════
    //  WebSocket
    // ═══════════════════════════════════════════
    function connect() {
        ws = new WebSocket('ws://' + location.host);
        ws.onopen = () => ws.send(JSON.stringify({ type: 'join', username: myName, profile: myProfile }));
        ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
        ws.onclose = () => setTimeout(connect, 3000);
    }
    let myProfile = {};

    function handleMessage(data) {
        switch(data.type) {
            case 'joined':
                myBalance = data.balance || 1000;
                document.getElementById('balance').textContent = myBalance;
                if (data.history) { history = data.history; renderHistory(); }
                break;
            case 'betting_start':
                gamePhase = 'betting';
                myBets = [];
                document.getElementById('resultDisplay').textContent = '⏰ 下注時間！';
                document.getElementById('resultDisplay').className = 'result-display spinning';
                document.getElementById('wheel').classList.remove('spinning');
                document.getElementById('winnersBanner').classList.remove('show');
                document.getElementById('placeBetBtn').disabled = false;
                updateMyBetsUI();
                startProgressBar(data.duration);
                playSound('click');
                break;
            case 'spinning':
                gamePhase = 'spinning';
                document.getElementById('resultDisplay').textContent = '🎰 轉動中...';
                document.getElementById('resultDisplay').className = 'result-display spinning';
                document.getElementById('wheel').classList.add('spinning');
                document.getElementById('placeBetBtn').disabled = true;
                stopProgressBar();
                playSound('spin');
                break;
            case 'result':
                gamePhase = 'result';
                document.getElementById('wheel').classList.remove('spinning');
                const colors = { red: '🔴 紅色', black: '⚫ 黑色', green: '🟢 綠色' };
                const resultNum = data.result;
                const resultColor = data.color;
                document.getElementById('resultDisplay').textContent = '結果: ' + resultNum + ' ' + colors[resultColor];
                document.getElementById('resultDisplay').className = 'result-display ' + resultColor;

                // 歷史記錄
                history.unshift(resultColor);
                if (history.length > MAX_HISTORY) history.pop();
                renderHistory();

                //結算
                const myWin = data.winners ? data.winners.find(w => w.username === myName) : null;
                const myLoss = data.losers ? data.losers.find(l => l.username === myName) : null;
                if (myWin) {
                    myBalance += myWin.prize;
                    triggerWinEffect(myWin.prize);
                    updateBalanceUI(true);
                }
                if (myLoss) { myBalance -= myLoss.amount; updateBalanceUI(false); }
                if (!myWin && !myLoss) { playSound('lose'); }
                document.getElementById('balance').textContent = myBalance;
                myBets = [];
                updateMyBetsUI();
                // 顯示贏家
                if (data.winners && data.winners.length > 0) {
                    showWinners(data.winners);
                }
                break;
        }
    }

    // ═══════════════════════════════════════════
    //  視覺特效
    // ═══════════════════════════════════════════
    function triggerWinEffect(prize) {
        playSound('win');
        triggerWinFlash();
        spawnCoinParticles(prize);
        triggerScreenShake();
    }
    function triggerWinFlash() {
        const f = document.getElementById('winFlash');
        f.classList.remove('active');
        void f.offsetWidth;
        f.classList.add('active');
        setTimeout(() => f.classList.remove('active'), 800);
    }
    function triggerScreenShake() {
        document.body.classList.remove('shaking');
        void document.body.offsetWidth;
        document.body.classList.add('shaking');
        setTimeout(() => document.body.classList.remove('shaking'), 700);
    }
    function spawnCoinParticles(prize) {
        const count = Math.min(Math.floor(prize / 50), 12);
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                const coin = document.createElement('div');
                coin.className = 'coin-particle';
                coin.textContent = '🪙';
                const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 160;
                coin.style.left = startX + 'px';
                coin.style.top = (window.innerHeight * 0.45) + 'px';
                document.body.appendChild(coin);
                setTimeout(() => coin.remove(), 1000);
            }, i * 80);
        }
    }
    function updateBalanceUI(isWin) {
        const el = document.getElementById('balance');
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
    }

    // ═══════════════════════════════════════════
    //  歷史路紙
    // ═══════════════════════════════════════════
    function renderHistory() {
        const container = document.getElementById('historyDots');
        container.innerHTML = '';
        history.forEach(color => {
            const dot = document.createElement('div');
            dot.className = 'history-dot ' + color;
            container.appendChild(dot);
        });
    }

    // ═══════════════════════════════════════════
    //  倒數進度條
    // ═══════════════════════════════════════════
    function startProgressBar(durationMs) {
        stopProgressBar();
        const bar = document.getElementById('progressBar');
        bar.style.transition = 'none';
        bar.style.width = '100%';
        void bar.offsetWidth;
        bar.style.transition = 'width ' + durationMs + 'ms linear';
        bar.style.width = '0%';

        let remaining = Math.floor(durationMs / 1000);
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            remaining--;
            document.getElementById('timer').textContent = remaining > 0 ? '⏰ ' + remaining + 's' : '—';
            if (remaining <= 3 && remaining > 0) playSound('tick');
            if (remaining <= 0) clearInterval(timerInterval);
        }, 1000);
    }
    function stopProgressBar() {
        clearInterval(timerInterval);
        clearInterval(progressTimer);
    }

    // ═══════════════════════════════════════════
    //  下注系統
    // ═══════════════════════════════════════════
    function setQuickAmount(amt) {
        quickAmount = amt;
        document.querySelectorAll('.quick-amt-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('betAmtInput').value = amt;
        playSound('click');
    }

    function selectBet(type, choice) {
        if (gamePhase !== 'betting') { alert('現在不能下注！'); return; }
        selectedBet = { type, choice };
        document.getElementById('selectedBetInfo').textContent = getBetLabel(type, choice);
        playSound('click');

        // 顯示選中
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
    }

    function selectNumber(n) {
        if (gamePhase !== 'betting') { alert('現在不能下注！'); return; }
        selectedBet = { type: 'number', choice: n };
        document.getElementById('selectedBetInfo').textContent = '#' + n + ' (10x)';
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
        event.target.classList.add('selected');
        playSound('click');
    }

    function getBetLabel(type, choice) {
        const labels = { red: '🔴 紅 2x', black: '⚫ 黑 2x', odd: '🔢 單 2x', even: '⚇ 雙 2x' };
        if (type === 'number') return '#' + choice + ' (10x)';
        return labels[choice] || choice;
    }

    function confirmBet() {
        if (gamePhase !== 'betting') { alert('現在不能下注！'); return; }
        if (!selectedBet) { alert('請先選擇紅/黑/單/雙/數字'); return; }
        const amt = parseInt(document.getElementById('betAmtInput').value) || quickAmount;
        if (amt < 10) { alert('最低下注10金幣'); return; }
        if (amt > myBalance) { alert('金幣不足！'); return; }

        const bet = { type: selectedBet.type, choice: selectedBet.choice, amount: amt, id: Date.now() };
        myBets.push(bet);

        ws.send(JSON.stringify({
            type: 'bet',
            username: myName,
            betType: selectedBet.type,
            amount: amt,
            color: selectedBet.type === 'color' ? selectedBet.choice : undefined,
            odd_even: selectedBet.type === 'odd_even' ? selectedBet.choice : undefined,
            number: selectedBet.type === 'number' ? selectedBet.choice : undefined
        }));

        playSound('bet');
        updateMyBetsUI();
        selectedBet = null;
        document.getElementById('selectedBetInfo').textContent = '';
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
    }

    function clearSelection() {
        selectedBet = null;
        document.getElementById('selectedBetInfo').textContent = '';
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
        playSound('click');
    }

    function updateMyBetsUI() {
        const el = document.getElementById('myBets');
        if (!myBets.length) { el.innerHTML = '尚無下注'; return; }
        el.innerHTML = myBets.map(b => {
            const label = b.type === 'number' ? '#' + b.choice : (b.choice === 'red' ? '🔴 紅' : b.choice === 'black' ? '⚫ 黑' : b.choice === 'odd' ? '🔢 單' : '⚇ 雙');
            const mult = b.type === 'number' ? '10x' : '2x';
            return '<div class="bet-item"><div class="bet-info"><span>' + label + '</span><span>' + mult + '</span></div><span>' + b.amount + '</span></div>';
        }).join('');
    }

    function showWinners(winners) {
        const banner = document.getElementById('winnersBanner');
        const list = document.getElementById('winnersList');
        list.innerHTML = winners.map(w =>
            '<div class="winner-item"><span class="name">' + w.username + '</span><span class="prize">+' + w.prize + '</span></div>'
        ).join('');
        banner.classList.add('show');
    }

    // ═══════════════════════════════════════════
    //  登入 / 初始化
    // ═══════════════════════════════════════════
    function doLogin() {
        myName = document.getElementById('username').value || 'Player' + Math.floor(Math.random() * 1000);
        const realname = document.getElementById('realname').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        myProfile = { realname, phone, email };
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('gameSection').style.display = 'block';
        buildNumberGrid();
        connect();
        playSound('click');
    }

    // ═══════════════════════════════════════════
    //  儲值 Modal
    // ═══════════════════════════════════════════
    function showTopupModal() { document.getElementById('topupModal').classList.add('show'); }
    function closeTopupModal() { document.getElementById('topupModal').classList.remove('show'); }
    function copyLineId() {
        const text = document.getElementById('lineIdText').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '已複製!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 2000);
        });
    }
    document.getElementById('topupModal').addEventListener('click', function(e) {
        if (e.target === this) closeTopupModal();
    });
    </script>
</body>
</html>
